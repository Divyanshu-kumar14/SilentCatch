services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      NEBIUS_API_KEY: ${NEBIUS_API_KEY:-}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
    # NEBIUS_API_KEY/TAVILY_API_KEY. Unset keys = offline replay mode (safe).
    env_file:
      - path: ./.env
        required: false

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        # NEXT_PUBLIC_* is inlined at build time, so it must be a build arg.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    depends_on:
      - backend
    ports:
      - "3000:3000"
    environment:
      # Runtime copy for server-side code; the browser bundle uses the build arg.
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
